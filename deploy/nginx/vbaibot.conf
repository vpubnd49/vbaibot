# ==============================================================================
# Cấu hình Nginx Reverse Proxy An ninh cao cho vbaibot
# ==============================================================================

# Rate limit zone: Chống Brute-force Login (Tối đa 5 req/s cho mỗi IP)
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

# Chuyển hướng HTTP sang HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name bot.yourdomain.gov.vn; # Thay thế bằng domain thực tế

    # Hỗ trợ ACME Challenge của Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Cấu hình chính HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bot.yourdomain.gov.vn; # Thay thế bằng domain thực tế

    # Chứng chỉ SSL/TLS
    ssl_certificate /etc/letsencrypt/live/bot.yourdomain.gov.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bot.yourdomain.gov.vn/privkey.pem;

    # Giao thức & Ciphers an toàn (chỉ TLS 1.2 & TLS 1.3)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Ẩn phiên bản Nginx
    server_tokens off;

    # Security Headers bổ trợ ở tầng Reverse Proxy
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Chặn đứng các bot quét file nhạy cảm và tấn công tự động
    location ~* /\.(env|git|svn|htaccess|htpasswd|bak|conf|sql|ini|sh|py|log) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* /(wp-admin|wp-login|phpmyadmin|adminer|pma|eval-stdin) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Endpoint Login: Áp dụng Rate Limiting chống Brute-force
    location /api/auth/login {
        limit_req zone=login_limit burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy mặc định cho Dashboard và API
    location / {
        limit_req zone=general_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout cấu hình hợp lý
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
