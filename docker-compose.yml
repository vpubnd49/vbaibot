services:
  vbaibot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vbaibot_app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      # Chỉ lắng nghe trên localhost nếu có Nginx Reverse Proxy phía trước
      - "127.0.0.1:3000:3000"
    volumes:
      # Mount thư mục data để lưu DB SQLite, logs, và tài khoản Zalo đã mã hóa
      - ./data:/app/data
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
        reservations:
          cpus: '0.2'
          memory: 256M
    networks:
      - vbaibot-net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  vbaibot-net:
    driver: bridge
